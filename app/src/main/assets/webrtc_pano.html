<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Live360 WebRTC Panorama</title>
    <!-- Убираем 404 favicon -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="lib/Pannellum2_5_6/pannellum.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; font-family: sans-serif; }
        #panorama { width: 100%; height: 100%; }
        #remoteVideo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; top: -10px; left: -10px; }
        .btn { position: absolute; z-index: 9999; padding: 10px 20px; font-size: 16px; background: #6200EE; color: white; border: none; border-radius: 5px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: none; }
        .btn:hover { background: #3700B3; }
        #unmuteBtn { top: 20px; left: 50%; transform: translateX(-50%); }
        #snapshotBtn { top: 20px; right: 20px; }
        #status { position: absolute; bottom: 20px; left: 20px; z-index: 9999; color: #4CAF50; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; font-weight: bold; pointer-events: none; }
        #status.error { color: #f44336; }
    </style>
</head>
<body>
<div id="panorama"></div>
<!-- ★ ДОБАВЛЕНО: width и height по умолчанию, чтобы Pannellum не ругался -->
<video id="remoteVideo" width="1280" height="640" autoplay playsinline muted></video>

<button id="unmuteBtn" class="btn">🔊 Включить звук</button>
<button id="snapshotBtn" class="btn">📷 Снимок</button>
<div id="status">Инициализация панорамы...</div>

<script src="lib/Pannellum2_5_6/libpannellum.js"></script>
<script src="lib/Pannellum2_5_6/pannellum.js"></script>

<script>
        const SIGNALING_URL = "ws://" + window.location.hostname + ":9090";

        const video = document.getElementById('remoteVideo');
        const statusText = document.getElementById('status');
        const unmuteBtn = document.getElementById('unmuteBtn');
        const snapshotBtn = document.getElementById('snapshotBtn');

        let pc = null;
        let viewer = null;

        // ★ ИСПРАВЛЕНО: Инициализируем Pannellum СРАЗУ, не ждем WebRTC
        function initPannellum() {
            if (typeof pannellum === 'undefined') {
                statusText.innerText = "Ошибка: pannellum.js не загружен!";
                statusText.classList.add('error');
                return;
            }

            try {
                viewer = pannellum.viewer('panorama', {
                    type: 'equirectangular',
                    panorama: video,        // Привязываем видео-элемент сразу
                    dynamic: true,
                    dynamicUpdate: true,
                    autoLoad: true,
                    hfov: 100,
                    minHfov: 50,
                    maxHfov: 120,
                    showControls: true,
                    compass: true
                });
                statusText.innerText = "Панорама готова. Ожидание потока...";
                snapshotBtn.style.display = "block";
            } catch (e) {
                statusText.innerText = "Ошибка Pannellum: " + e.message;
                statusText.classList.add('error');
            }
        }

        // Запускаем инициализацию движка сразу после загрузки DOM
        window.addEventListener('DOMContentLoaded', initPannellum);

        function connect() {
            const ws = new WebSocket(SIGNALING_URL);

            ws.onopen = () => {
                statusText.innerText = "Ожидание WebRTC Offer...";
            };

            ws.onmessage = async (msg) => {
                const data = JSON.parse(msg.data);

                if (data.type === 'offer') {
                    statusText.innerText = "Получен Offer, установка соединения...";

                    if (!pc) {
                        pc = new RTCPeerConnection({
                            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
                        });

                        pc.ontrack = (event) => {
                            if (video.srcObject !== event.streams[0]) {
                                video.srcObject = event.streams[0];

                                // Просто запускаем видео. Pannellum сам подхватит кадры.
                                video.play().then(() => {
                                    unmuteBtn.style.display = "block";
                                    statusText.innerText = "Трансляция активна";
                                }).catch(e => {
                                    console.error("Ошибка автоплея:", e);
                                });
                            }
                        };

                        pc.oniceconnectionstatechange = () => {
                            if (pc.iceConnectionState === 'connected') {
                                statusText.innerText = "Соединение установлено, буферизация...";
                            } else if (pc.iceConnectionState === 'failed') {
                                statusText.innerText = "Ошибка соединения ICE.";
                                statusText.classList.add('error');
                            }
                        };

                        pc.onicecandidate = (event) => {
                            if (event.candidate) {
                                ws.send(JSON.stringify({
                                    type: 'candidate',
                                    candidate: event.candidate
                                }));
                            }
                        };
                    }

                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);

                    ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
                } else if (data.type === 'candidate') {
                    if (pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            };

            ws.onerror = () => {
                statusText.innerText = "Ошибка WebSocket. Проверьте IP и порт.";
                statusText.classList.add('error');
            };
        }

        unmuteBtn.addEventListener('click', () => {
            video.muted = false;
            video.volume = 1.0;
            unmuteBtn.style.display = "none";
        });

        snapshotBtn.addEventListener('click', () => {
            if (!video.videoWidth) return;
            const canvas = document.createElement('canvas');
            const glCanvas = document.querySelector('#panorama canvas');
            if (glCanvas) {
                canvas.width = glCanvas.width;
                canvas.height = glCanvas.height;
                canvas.getContext('2d').drawImage(glCanvas, 0, 0);
            }
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/jpeg', 0.9);
            a.download = 'webrtc_snap_' + Date.now() + '.jpg';
            a.click();
        });

        connect();
    </script>
</body>
</html>
